{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — {{ NOM_ENTREPRISE }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card glass-panel">
    <div class="login-card__mark">GC</div>
    <h1>Bon retour</h1>
    <p class="subtitle">Connectez-vous pour piloter votre activité commerciale.</p>
    {% if form.errors %}<p class="error-text" style="margin-bottom:14px;">Identifiants incorrects. Veuillez réessayer.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-field" style="margin-bottom:14px;"><label>Nom d'utilisateur</label>{{ form.username }}</div>
      <div class="form-field" style="margin-bottom:18px;"><label>Mot de passe</label>{{ form.password }}</div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Se connecter</button>
    </form>
  </div>
</div>
</body>
</html>
