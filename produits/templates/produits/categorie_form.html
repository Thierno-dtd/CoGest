{% extends "base.html" %}
{% block page_titre %}{{ titre }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;">
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      <div class="form-field form-field--full"><label>Libellé</label>{{ form.libelle }}</div>
      <div class="form-field form-field--full"><label>Description</label>{{ form.description }}</div>
      <div class="form-field form-field--full switch-row">{{ form.est_active }}<label>Catégorie active</label></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{% url 'produits:categorie_liste' %}" class="btn btn-ghost">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
